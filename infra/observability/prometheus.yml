global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: civora-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]

  - job_name: civora-otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

