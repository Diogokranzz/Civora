name: Deploy Civora to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build internal packages
        run: |
          pnpm --filter @civora/types build
          pnpm --filter @civora/config build
          pnpm --filter @civora/ui build
          pnpm --filter @civora/ui-spatial build
          pnpm --filter @civora/sdk build

      - name: Build GitHub Pages static export
        env:
          NEXT_OUTPUT_EXPORT: 'true'
          NEXT_PUBLIC_DEMO_MODE: 'true'
          NEXT_PUBLIC_BASE_PATH: '/Civora'
        run: pnpm build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
